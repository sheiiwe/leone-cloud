<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body {
    width:100%; height:100%;
    background:#1c1c1a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-app-region: drag;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }
  .splash-content {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    opacity:0;
    transform:scale(0.85);
    animation: splashIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  }
  @keyframes splashIn {
    to { opacity:1; transform:scale(1); }
  }
  .splash-content.fade-out {
    animation: splashOut 0.5s ease-in forwards;
  }
  @keyframes splashOut {
    to { opacity:0; transform:scale(1.05); }
  }
  img {
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
  }
  .name {
    font-size:22px;
    font-weight:700;
    color:#f0efe9;
    letter-spacing:-0.3px;
  }
  .sub {
    font-size:13px;
    color:#6b6b66;
    margin-top:-14px;
  }
  .loader {
    width:40px;
    height:2px;
    background:#2a2a28;
    border-radius:2px;
    overflow:hidden;
    margin-top:8px;
  }
  .loader-bar {
    height:100%;
    width:0%;
    background:#c0392b;
    border-radius:2px;
    animation: load 1.6s ease-out 0.4s forwards;
  }
  @keyframes load {
    to { width:100%; }
  }
</style>
</head>
<body>
<div class="splash-content" id="content">
  <img id="splash-logo" src="../assets/icon.png" alt="Logo">
  <div>
    <div class="name">Leone Consulting</div>
    <div class="sub">di Leonardo Angelucci</div>
  </div>
  <div class="loader"><div class="loader-bar"></div></div>
</div>
<script>
  // Fade out dopo 1.8s poi chiudi
  setTimeout(() => {
    document.getElementById('content').classList.add('fade-out')
  }, 1800)
</script>
</body>
</html>
